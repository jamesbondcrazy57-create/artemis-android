name: Build patched Artemis ESC APK

on:
  push:
    branches:
      - fix-physical-esc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android command-line tools and NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build nonRoot_game release APK
        run: ./gradlew assembleNonRoot_gameRelease --stacktrace

      - name: Sign ARM64 APK with test key
        run: |
          APK="$(find app/build/outputs/apk -type f -name "*nonRoot_game*arm64-v8a*release-unsigned.apk" | head -n 1)"
          test -n "$APK"
          keytool -genkeypair -v -keystore esc-test.keystore -storepass android -keypass android \
            -alias escpatch -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Artemis ESC Patch,O=Local Test,C=US"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          mkdir -p artifact
          "$APKSIGNER" sign --ks esc-test.keystore --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias escpatch --out artifact/artemis-esc-patched-arm64-v8a.apk "$APK"
          "$APKSIGNER" verify --verbose artifact/artemis-esc-patched-arm64-v8a.apk
          ls -lah artifact

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: artemis-esc-patched-apk
          path: artifact/*.apk
          if-no-files-found: error
