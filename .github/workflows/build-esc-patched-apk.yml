name: Build patched Artemis ESC APK

on:
  push:
    branches:
      - fix-physical-esc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build nonRoot_game release APK
        run: ./gradlew assembleNonRoot_gameRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p artifact
          find app/build/outputs/apk -type f -name "*.apk" -exec cp {} artifact/ \;
          ls -lah artifact

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: artemis-esc-patched-apk
          path: artifact/*.apk
          if-no-files-found: error
